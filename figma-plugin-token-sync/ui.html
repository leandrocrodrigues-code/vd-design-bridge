<style>
  :root { color-scheme: light dark; }
  body {
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    color: #1a1a1a;
  }
  h1 { font-size: 13px; margin: 0 0 12px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type="password"], input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font: inherit;
    margin-bottom: 8px;
  }
  button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #18a0fb;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font: inherit;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: #18a0fb;
    text-decoration: underline;
    padding: 0;
    font-weight: 400;
  }
  .token-status { font-size: 11px; color: #666; margin-bottom: 8px; }
  #sync-btn { width: 100%; }
  #log {
    margin-top: 12px;
    background: #f5f5f5;
    border-radius: 6px;
    padding: 8px;
    height: 220px;
    overflow-y: auto;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    white-space: pre-wrap;
  }
  .log-line.ok { color: #0a7a2f; }
  .log-line.err { color: #c0392b; }
  .log-line.info { color: #555; }
  @media (prefers-color-scheme: dark) {
    body { background: #2c2c2c; color: #eee; }
    input { background: #1e1e1e; color: #eee; border-color: #444; }
    #log { background: #1e1e1e; }
    .log-line.info { color: #aaa; }
  }
</style>

<h1>VD Token Sync</h1>

<div id="token-section" class="field">
  <label for="pat">GitHub Personal Access Token</label>
  <input id="pat" type="password" placeholder="ghp_..." autocomplete="off" />
  <button id="save-token-btn">Salvar token</button>
</div>

<div id="token-saved-section" class="field" style="display:none;">
  <div class="token-status">Token salvo neste arquivo ✓ &nbsp;<button id="change-token-btn" class="secondary">trocar</button></div>
</div>

<button id="sync-btn" disabled>Sincronizar tokens</button>

<div id="log"></div>

<script>
  var GITHUB_OWNER = 'leandrocrodrigues-code';
  var GITHUB_REPO = 'vd-design-bridge';
  var GITHUB_BASE_BRANCH = 'main';
  var TOKENS_BRANCH = 'tokens-sync';
  var FILES = [
    { bucket: 'color', path: 'tokens/colors.json', topKey: 'color' },
    { bucket: 'spacing', path: 'tokens/spacing.json', topKey: 'spacing' },
    { bucket: 'typography', path: 'tokens/typography.json', topKey: 'typography' },
    { bucket: 'radius', path: 'tokens/radius.json', topKey: 'radius' },
    { bucket: 'sizing', path: 'tokens/sizing.json', topKey: 'sizing' },
  ];

  var githubToken = null;

  var patInput = document.getElementById('pat');
  var tokenSection = document.getElementById('token-section');
  var tokenSavedSection = document.getElementById('token-saved-section');
  var syncBtn = document.getElementById('sync-btn');
  var logEl = document.getElementById('log');

  function log(message, level) {
    var line = document.createElement('div');
    line.className = 'log-line ' + (level || 'info');
    line.textContent = message;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setTokenUiState(hasToken) {
    tokenSection.style.display = hasToken ? 'none' : 'block';
    tokenSavedSection.style.display = hasToken ? 'block' : 'none';
    syncBtn.disabled = !hasToken;
  }

  document.getElementById('save-token-btn').addEventListener('click', function () {
    var value = patInput.value.trim();
    if (!value) return;
    githubToken = value;
    parent.postMessage({ pluginMessage: { type: 'save-token', token: value } }, '*');
    patInput.value = '';
    setTokenUiState(true);
    log('Token salvo neste arquivo Figma (figma.clientStorage).', 'ok');
  });

  document.getElementById('change-token-btn').addEventListener('click', function () {
    parent.postMessage({ pluginMessage: { type: 'clear-token' } }, '*');
    githubToken = null;
    setTokenUiState(false);
  });

  syncBtn.addEventListener('click', function () {
    logEl.innerHTML = '';
    log('Lendo Variables do Figma...', 'info');
    syncBtn.disabled = true;
    parent.postMessage({ pluginMessage: { type: 'sync-request' } }, '*');
  });

  function toBase64(str) {
    var bytes = new TextEncoder().encode(str);
    var binary = '';
    bytes.forEach(function (b) { binary += String.fromCharCode(b); });
    return btoa(binary);
  }

  function fromBase64(b64) {
    var binary = atob(b64.replace(/\n/g, ''));
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  // pathSuffix é o caminho da API do GitHub relativo ao repo, ex.
  // "contents/tokens/colors.json?ref=tokens-sync", "branches/tokens-sync",
  // "git/refs", "pulls".
  function githubApi(pathSuffix, options) {
    var opts = options || {};
    var headers = Object.assign({
      'Authorization': 'Bearer ' + githubToken,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    }, opts.headers || {});
    return fetch(
      'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/' + pathSuffix,
      Object.assign({}, opts, { headers: headers }),
    );
  }

  // Garante que a branch tokens-sync existe, criando a partir do HEAD atual
  // da main se ainda não existir.
  async function ensureTokensBranch() {
    var checkRes = await githubApi('branches/' + encodeURIComponent(TOKENS_BRANCH));
    if (checkRes.status === 200) return;
    if (checkRes.status !== 404) {
      throw new Error('erro ao checar branch "' + TOKENS_BRANCH + '" (' + checkRes.status + ') ' + (await checkRes.text()));
    }

    log('Branch "' + TOKENS_BRANCH + '" não existe ainda — criando a partir de "' + GITHUB_BASE_BRANCH + '"...', 'info');
    var mainRefRes = await githubApi('git/ref/heads/' + GITHUB_BASE_BRANCH);
    if (!mainRefRes.ok) {
      throw new Error('erro ao ler HEAD de "' + GITHUB_BASE_BRANCH + '" (' + mainRefRes.status + ') ' + (await mainRefRes.text()));
    }
    var mainRef = await mainRefRes.json();

    var createRes = await githubApi('git/refs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'refs/heads/' + TOKENS_BRANCH, sha: mainRef.object.sha }),
    });
    if (!createRes.ok) {
      throw new Error('erro ao criar branch "' + TOKENS_BRANCH + '" (' + createRes.status + ') ' + (await createRes.text()));
    }
    log('Branch "' + TOKENS_BRANCH + '" criada.', 'ok');
  }

  // GET do SHA/conteúdo atual de um arquivo, sempre na branch tokens-sync.
  // Lançado logo antes de cada PUT (nunca cacheado entre arquivos ou
  // reusado num retry sem reler).
  async function getShaAndContent(path) {
    var getRes = await githubApi('contents/' + path + '?ref=' + TOKENS_BRANCH, { method: 'GET' });
    if (getRes.status === 200) {
      var data = await getRes.json();
      return { sha: data.sha, content: fromBase64(data.content) };
    }
    if (getRes.status === 404) {
      return { sha: undefined, content: null };
    }
    var errBody = await getRes.text();
    throw new Error('GET falhou (' + getRes.status + ') ' + errBody);
  }

  function putFile(path, contentStr, sha) {
    var putBody = {
      message: 'chore: sync design tokens from Figma plugin',
      content: toBase64(contentStr),
      branch: TOKENS_BRANCH,
    };
    if (sha) putBody.sha = sha;
    return githubApi('contents/' + path, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(putBody),
    });
  }

  // --- Diff por chave (added/removed/changed), só pra relatório no log e
  // no corpo do PR — a decisão de gravar ou não continua sendo a
  // comparação de string bruta em syncFile().
  function flattenLeaves(obj, prefix, out) {
    out = out || {};
    if (!obj || typeof obj !== 'object') return out;
    if ('value' in obj) {
      out[prefix || ''] = obj;
      return out;
    }
    Object.keys(obj).forEach(function (key) {
      flattenLeaves(obj[key], prefix ? prefix + '.' + key : key, out);
    });
    return out;
  }

  function diffTokens(oldBucket, newBucket) {
    var oldLeaves = flattenLeaves(oldBucket);
    var newLeaves = flattenLeaves(newBucket);
    var added = [], removed = [], changed = [];
    Object.keys(newLeaves).forEach(function (key) {
      if (!(key in oldLeaves)) {
        added.push(key);
      } else if (JSON.stringify(oldLeaves[key]) !== JSON.stringify(newLeaves[key])) {
        changed.push(key);
      }
    });
    Object.keys(oldLeaves).forEach(function (key) {
      if (!(key in newLeaves)) removed.push(key);
    });
    return { added: added, removed: removed, changed: changed };
  }

  function logDiffSummary(path, diff) {
    var parts = [];
    if (diff.added.length) parts.push('+' + diff.added.length + ' adicionada(s)');
    if (diff.removed.length) parts.push('-' + diff.removed.length + ' removida(s)');
    if (diff.changed.length) parts.push('~' + diff.changed.length + ' alterada(s)');
    log(path + ': ' + (parts.length ? parts.join(', ') : 'conteúdo mudou'), 'info');

    var sample = diff.added.slice(0, 3).map(function (k) { return '+ ' + k; })
      .concat(diff.removed.slice(0, 3).map(function (k) { return '- ' + k; }))
      .concat(diff.changed.slice(0, 3).map(function (k) { return '~ ' + k; }));
    sample.forEach(function (line) { log('    ' + line, 'info'); });
  }

  async function syncFile(entry, tokens) {
    var newObj = {};
    newObj[entry.topKey] = tokens[entry.bucket];
    var newContentStr = JSON.stringify(newObj, null, 2) + '\n';

    var current;
    try {
      current = await getShaAndContent(entry.path);
    } catch (err) {
      log(entry.path + ': erro ao ler arquivo atual — ' + err.message, 'err');
      return null;
    }

    if (current.content === newContentStr) {
      log(entry.path + ': sem mudanças.', 'info');
      return null;
    }

    var oldBucket = null;
    if (current.content) {
      try {
        oldBucket = JSON.parse(current.content)[entry.topKey];
      } catch (e) {
        oldBucket = null;
      }
    }
    var diff = diffTokens(oldBucket, newObj[entry.topKey]);
    logDiffSummary(entry.path, diff);

    // GET imediatamente seguido do PUT desse mesmo arquivo — par atômico,
    // sem reusar SHA de uma leitura anterior nem de outro arquivo.
    var putRes = await putFile(entry.path, newContentStr, current.sha);

    if (putRes.status === 409) {
      // SHA ficou desatualizado entre o GET e o PUT (corrida de milissegundos
      // com outra escrita). Rele o arquivo pra pegar o SHA mais recente e
      // tenta de novo, uma única vez.
      log(entry.path + ': 409 (SHA desatualizado) — relendo e tentando de novo...', 'info');
      var fresh;
      try {
        fresh = await getShaAndContent(entry.path);
      } catch (err) {
        log(entry.path + ': erro ao reler arquivo pro retry — ' + err.message, 'err');
        return null;
      }
      if (fresh.content === newContentStr) {
        log(entry.path + ': sem mudanças (outra escrita já aplicou o mesmo conteúdo).', 'info');
        return null;
      }
      putRes = await putFile(entry.path, newContentStr, fresh.sha);
    }

    if (putRes.ok) {
      log(entry.path + ': atualizado com sucesso na branch "' + TOKENS_BRANCH + '".', 'ok');
      return { path: entry.path, diff: diff };
    } else {
      var errBody = await putRes.text();
      log(entry.path + ': erro ao gravar (' + putRes.status + ') ' + errBody, 'err');
      return null;
    }
  }

  // Cria o PR tokens-sync -> main se ainda não houver um aberto. Se já
  // houver, não mexe nele — o push que syncFile() já fez na branch já
  // atualiza o PR existente automaticamente (comportamento padrão do Git).
  async function ensurePullRequest(results) {
    var listRes = await githubApi(
      'pulls?head=' + encodeURIComponent(GITHUB_OWNER + ':' + TOKENS_BRANCH) +
      '&base=' + GITHUB_BASE_BRANCH + '&state=open',
    );
    if (!listRes.ok) {
      throw new Error('GET pulls falhou (' + listRes.status + ') ' + (await listRes.text()));
    }
    var existing = await listRes.json();
    if (existing.length > 0) {
      log('PR já estava aberto — o commit atualizou ele automaticamente.', 'info');
      return existing[0].html_url;
    }

    var today = new Date().toISOString().slice(0, 10);
    var bodyLines = results.map(function (r) {
      var d = r.diff;
      var parts = [];
      if (d.added.length) parts.push(d.added.length + ' adicionada(s)');
      if (d.removed.length) parts.push(d.removed.length + ' removida(s)');
      if (d.changed.length) parts.push(d.changed.length + ' alterada(s)');
      return '- `' + r.path + '`' + (parts.length ? ': ' + parts.join(', ') : '');
    });
    var body = 'Sincronização automática de design tokens do Figma via plugin VD Token Sync.\n\n' +
      'Arquivos alterados:\n' + bodyLines.join('\n');

    var createRes = await githubApi('pulls', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: 'Sync de tokens do Figma - ' + today,
        head: TOKENS_BRANCH,
        base: GITHUB_BASE_BRANCH,
        body: body,
      }),
    });
    if (!createRes.ok) {
      throw new Error('POST pulls falhou (' + createRes.status + ') ' + (await createRes.text()));
    }
    var created = await createRes.json();
    log('PR criado.', 'ok');
    return created.html_url;
  }

  window.onmessage = async function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'token-value') {
      if (msg.token) {
        githubToken = msg.token;
        setTokenUiState(true);
      } else {
        setTokenUiState(false);
      }
      return;
    }

    if (msg.type === 'token-cleared') {
      log('Token removido.', 'info');
      return;
    }

    if (msg.type === 'tokens-data') {
      log('Variables lidas. Sincronizando com o GitHub...', 'info');
      if (msg.skipped && msg.skipped.length) {
        msg.skipped.forEach(function (s) { log('Ignorado: ' + s, 'info'); });
      }

      try {
        await ensureTokensBranch();
      } catch (err) {
        log('Erro ao preparar a branch "' + TOKENS_BRANCH + '": ' + err.message, 'err');
        syncBtn.disabled = false;
        return;
      }

      var results = [];
      for (var i = 0; i < FILES.length; i++) {
        var entry = FILES[i];
        var bucketData = msg.tokens[entry.bucket];
        if (!bucketData || Object.keys(bucketData).length === 0) {
          log(entry.path + ': nenhuma variable em "' + entry.bucket + '/*" nesta rodada — arquivo mantido como está.', 'info');
          continue;
        }
        var result = await syncFile(entry, msg.tokens);
        if (result) results.push(result);
      }

      if (results.length === 0) {
        log('Nenhum arquivo mudou — nada pra abrir PR.', 'info');
      } else {
        try {
          var prUrl = await ensurePullRequest(results);
          log('Revisar: ' + prUrl, 'ok');
        } catch (err) {
          log('Commits feitos em "' + TOKENS_BRANCH + '", mas o PR falhou: ' + err.message, 'err');
        }
      }

      log('Sincronização concluída.', 'ok');
      syncBtn.disabled = false;
      return;
    }

    if (msg.type === 'error') {
      log('Erro: ' + msg.message, 'err');
      syncBtn.disabled = false;
      return;
    }
  };

  // Ao abrir o plugin, pergunta pro code.ts se já existe um token salvo.
  parent.postMessage({ pluginMessage: { type: 'get-token' } }, '*');
</script>
