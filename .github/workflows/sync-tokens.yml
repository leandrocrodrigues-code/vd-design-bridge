name: Sync Figma Tokens

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-figma-tokens
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync tokens from Figma
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node scripts/sync-figma-tokens.js

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- tokens/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push token changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tokens/
          git commit -m "chore: sync design tokens from Figma"
          git push

      # O GITHUB_TOKEN não dispara outros workflows via evento "push" (proteção
      # anti-loop nativa do Actions), então o deploy-storybook.yml não rebuildaria
      # sozinho a partir do commit acima. workflow_dispatch é uma exceção a essa
      # regra, por isso disparamos o deploy explicitamente aqui.
      - name: Trigger Storybook deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-storybook.yml --ref main
